<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D y Realidad Aumentada</title>
  
  <!-- Carga de la librería Model Viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f5f5f5;
    }
    /* Estilo del botón de Realidad Aumentada */
    #ar-button {
      background-color: #007bff;
      color: white;
      border-radius: 20px;
      border: none;
      padding: 12px 24px;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Componente 3D y AR -->
  <model-viewer 
    src="modelo.glb" 
    ios-src="modelo.usdz" 
    alt="Modelado 3D interactivo" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
    
    <button slot="ar-button" id="ar-button">
      📷 Ver en tu espacio (AR)
    </button>

  </model-viewer>

</body>
</html>
